name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Delta ships shaded jars; keep the ivy cache stable across jobs.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Unit + data tests
  # ---------------------------------------------------------------------------
  test:
    name: lint + pytest (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Spark / Delta ivy jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy2-${{ runner.os }}-delta-spark-3.2.0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: pytest with coverage
        run: pytest --cov=dlg --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Full pipeline on a reduced row count (DLG_SCALE=small)
  # ---------------------------------------------------------------------------
  data-tests:
    name: pipeline @ DLG_SCALE=small
    runs-on: ubuntu-latest
    needs: test
    env:
      DLG_SCALE: small
      DLG_SPARK_LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Spark / Delta ivy jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy2-${{ runner.os }}-delta-spark-3.2.0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate data
        run: make gen-data

      - name: Bronze
        run: make bronze

      - name: Silver
        run: make silver

      - name: Gold
        run: make gold

      - name: Governance (catalog validation, policies, lineage)
        run: make governance

      # Blocking DQ failures fail the build: `quality-run` exits non-zero.
      - name: Quality run (blocking DQ gate)
        run: python -m dlg.cli quality-run

      - name: SLA check
        run: python -m dlg.cli sla-check

      - name: Observability
        run: python -m dlg.cli observe

      - name: Streaming ingest (availableNow)
        run: make stream

      # Exits non-zero unless every safety-tagged eval case is refused.
      - name: Agent eval (safety gate)
        run: make agent-eval

      # Fails if the gold metrics drift from tests/baseline/metrics_baseline.json.
      - name: Regression baseline check
        run: python -m dlg.cli baseline-check

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: warn
