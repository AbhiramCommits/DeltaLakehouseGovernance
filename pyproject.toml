[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltalake_governance"
version = "0.1.0"
description = "A local-but-real Databricks-style medallion lakehouse on Delta Lake with governance, data quality, streaming ingest and a governed agentic analytics service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Delta Lakehouse Governance" }]
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "typer>=0.12",
    "tabulate>=0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
dlg = "dlg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dlg = ["quality/*.yml", "evals/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: end-to-end pipeline tests"]

[tool.coverage.run]
source = ["dlg"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
